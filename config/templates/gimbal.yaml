# 云台增量模板；Yaw编码器零位通过CALI校准，Pitch使用DM4310电机零位。
# 电机CAN3、yaw 0x205/0x206电压模式、pitch 0x03/0x13且±12.5rad取自原车。
# 标定结果写入Flash数据库database；未注册database时改回nullptr，结果仅在本次上电有效。
modules:
- module: HFUT-WDR/CMD
  id: cmd
  args:
  - mode: CMD::Mode::CMD_OP_CTRL
  - chassis_cmd_topic_name: '"chassis_cmd"'
  - gimbal_cmd_topic_name: '"gimbal_cmd"'
  - launcher_cmd_topic_name: '"launcher_cmd"'
  - auto_chassis_wz_source: CMD::ChassisWzSource::RC
- module: HFUT-WDR/I6x
  id: i6x
  args:
  - uart: uart5
  - cmd: cmd
  - topic_name: i6x_input
  - chassis_param:
      speed_x: 2.64
      speed_y: 2.64
      spin: 12
      deadband: 0.015151515151515152
- module: HFUT-WDR/HostData
  id: host_data
  args:
  - cmd: cmd
  - host_gimbal_topic_name: '"target_euler"'
  - host_chassis_data_topic_name: '"host_chassis_data"'
  - host_fire_topic_name: '"host_fire_notify"'
  - host_gimbal_command_topic_name: '"host_gimbal_command"'
- module: HFUT-WDR/RMMotor
  id: big_yaw_motor
  args:
  - can_bus: can3
  - param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 517
      gm6020_mode: RMMotor::Gm6020Mode::VOLTAGE
- module: HFUT-WDR/RMMotor
  id: small_yaw_motor
  args:
  - can_bus: can3
  - param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 518
      gm6020_mode: RMMotor::Gm6020Mode::VOLTAGE
- module: HFUT-WDR/DMMotor
  id: pitch_motor
  args:
  - can_bus: can3
  - param:
      model: DMMotor::Model::MOTOR_DM4310
      reverse: false
      can_id: 3
      position_max: 12.5
- module: HFUT-WDR/DmImu
  id: dm_imu
  args:
  - param:
      transport: wdr_imu::DmTransport::RS485_STREAM_LEGACY
      output: wdr_imu::DmOutput::FUSED
      device_id: 1
      feedback_id: 17
      baudrate: 4000000
      period_ms: 1
      timeout_ms: 50
      retries: 2
      data_mask: 15
  - can: nullptr
  - uart: '&usart2'
  - output_topic_name: '"dm_attitude"'
  - raw_topic_name: '"dm_measurement"'
  - diagnostics_topic_name: '"dm_diagnostics"'
  - installation: wdr_imu::IDENTITY
- module: HFUT-WDR/Referee
  id: referee
  args:
  - uart: usart1
  - cmd: nullptr
  - param:
      task_stack_depth_uart: 2048
      baudrate: 115200
      referee_chassis_tp_name: chassis_ref
      referee_launcher_tp_name: launcher_ref
      referee_robot_game_tp_name: robot_game_ref
      referee_radar_tp_name: radar_ref
      thread_priority_uart: LibXR::Thread::Priority::MEDIUM
      chassis: '{}'
      referee_power_tp_name: chassis_power_ref
- module: HFUT-WDR/RMMotor
  id: fric_right_motor
  args:
  - can_bus: can2
  - param:
      model: RMMotor::Model::MOTOR_M3508
      reverse: true
      feedback_id: 517
      gm6020_mode: RMMotor::Gm6020Mode::CURRENT
- module: HFUT-WDR/RMMotor
  id: fric_left_motor
  args:
  - can_bus: can2
  - param:
      model: RMMotor::Model::MOTOR_M3508
      reverse: false
      feedback_id: 518
      gm6020_mode: RMMotor::Gm6020Mode::CURRENT
- module: HFUT-WDR/RMMotor
  id: trigger_motor
  args:
  - can_bus: can3
  - param:
      model: RMMotor::Model::MOTOR_M2006
      reverse: false
      feedback_id: 519
      gm6020_mode: RMMotor::Gm6020Mode::CURRENT
- module: HFUT-WDR/Launcher
  id: launcher
  args:
  - fric_right: fric_right_motor
  - fric_left: fric_left_motor
  - trigger: trigger_motor
  - param:
      fric_rpm_to_speed: 0.00359375
      trigger_rpm_to_speed: 0.002908882086657216
      fric_pid:
        kp: 8000
        ki: 5
        kd: 0
        i_limit: 1000
        out_limit: 16000
      trigger_pid:
        kp: 1000
        ki: 2
        kd: 0
        i_limit: 7000
        out_limit: 10000
      trigger_filter: '{1.725709860247969f, -0.75594777109163436f, 0.030237910843665373f}'
      spin_up_tolerance: 0.3
      auto_spin_up_tolerance: 0.1
      brake_speed: 0.1
      fire_speed: 20
      jam_speed: 1
      jam_ms: 1000
      reverse_ms: 500
      initial_speed: 21
      reference_speed: 23.5
      speed_min: 15
      speed_max: 23.5
      speed_limit: 25
      speed_step: 0.2
      speed_deadband: 0.5
      urgent_margin: 0.5
      urgent_step: 0.3
      speed_ema_alpha: 0.3
      min_valid_speed: 5
      speed_adjust_interval_ms: 5000
      heat_per_shot: 10
      default_heat_limit: 260
      default_cooling: 30
      heat_stop_margin: 80
      shot_current_a: 3
      shot_confirm_ms: 10
      shot_interval_ms: 10
      cooling_period_ms: 100
      heat_sync_period_ms: 200
      heat_sync_max_step: 20
      motor_timeout_ms: 20
      referee_timeout_ms: 1000
  - fire_topic_name: '"launcher_cmd"'
  - referee_topic_name: '"robot_game_ref"'
  - status_topic_name: '"launcher_status"'
- module: HFUT-WDR/Gimbal
  id: gimbal
  args:
  - big_yaw: big_yaw_motor
  - small_yaw: small_yaw_motor
  - pitch_motor: pitch_motor
  - cmd: cmd
  - param:
      yaw_manual_speed: 3.96
      pitch_manual_speed: 1.98
      deadband: 0.015151515151515152
      init_error: 0.1
      init_yaw_gain: 5
      init_pitch_velocity: 0.5
      calibration_voltage: 8000
      calibration_gyro_limit: 0.1
      calibration_margin: 0.1
      init_timeout_ms: 6000
      init_hold_ms: 1000
      calibration_hold_ms: 2000
      calibration_step_timeout_ms: 15000
      yaw:
        big_yaw:
          offset_ecd: 0
          minimum: -3
          maximum: 3
          angle:
            kp: 30
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 0
            output_limit: 10
            integral_zone: 0.1
          auto_angle:
            kp: 20
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 0
            output_limit: 10
            integral_zone: 0.1
          relative:
            kp: 25
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 0
            output_limit: 10
            integral_zone: 0
          velocity:
            kp: 22000
            ki: 500
            kd: 0
            kf: 0
            integral_limit: 10000
            output_limit: 30000
            integral_zone: 0
          soft_velocity:
            kp: 20000
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 10000
            output_limit: 30000
            integral_zone: 0
        small_yaw:
          offset_ecd: 0
          minimum: -0.785398
          maximum: 0.785398
          angle:
            kp: 40
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 1
            output_limit: 10
            integral_zone: 0.08
          auto_angle:
            kp: 30
            ki: 0.05
            kd: 0
            kf: 0
            integral_limit: 1
            output_limit: 10
            integral_zone: 0.08
          relative:
            kp: 20
            ki: 1
            kd: 0
            kf: 0
            integral_limit: 1
            output_limit: 10
            integral_zone: 0
          velocity:
            kp: 12000
            ki: 5
            kd: 0
            kf: 0
            integral_limit: 2000
            output_limit: 30000
            integral_zone: 0
          soft_velocity:
            kp: 7000
            ki: 0
            kd: 0
            kf: 0
            integral_limit: 0
            output_limit: 30000
            integral_zone: 0
        voltage_limit: 30000
        align_alpha: 0.001
        velocity_feedforward: 0.9
        accel_feedforward: 120
        small_yaw_min_kp: 10
        small_yaw_min_velocity_kp: 7000
        scan_speed: 1.5
        scan_low_speed: 1
        motor_timeout_ms: 10
      pitch:
        zero: 0
        minimum: -0.47
        maximum: 0.57
        absolute_minimum: -0.31
        absolute_maximum: 0.5
        mit_kp: 15
        mit_kd: 1.4
        tracking_kd: 1
        inertia: 0.01116936
        damping: 0.02214229
        gravity: 0.8850881
        coulomb: 0.14099603
        coulomb_smooth: 0.5
        tracking_kp: 3000
        tracking_ki: 10
        tracking_kd_feedback: 150
        integral_error_min: 0.004
        integral_error_max: 0.05
        integral_reset_error: 0.1
        integral_min: -0.3
        integral_max: 0.2
        integral_reverse_decay: 0.85
        scan_kd: 1
        torque_limit: 5
        td_w: 40
        td_zeta: 1
        scan_center: 0.1
        scan_amplitude: 0.35
        scan_frequency: 1
        high_scan_center: -0.3
        high_scan_amplitude: 0.2
        high_scan_frequency: 1
        scan_center_speed: 2
        scan_ramp_speed: 1
        motor_timeout_ms: 20
        enable_period_ms: 500
        relative_pid:
          kp: 26
          ki: 0.002
          kd: 0.0002
          kf: 0
          integral_limit: 0
          output_limit: 10
          integral_zone: 0
  - calibration_database: '&database'
  - calibration_key: '"gimbal_yaw_calibration"'
  - command_topic_name: '"gimbal_cmd"'
  - board_topic_name: '"board_attitude"'
  - dm_topic_name: '"dm_attitude"'
  - context_topic_name: '"gimbal_context"'
  - referee_topic_name: '"robot_game_ref"'
  - chassis_topic_name: '"gimbal_chassis_feedback"'
  - status_topic_name: '"gimbal_status"'
  - task_stack_depth: 4096
  - thread_priority: LibXR::Thread::Priority::MEDIUM
  - launcher: '&launcher'
  - calibration_buzzer: '&buzzer'
- module: HFUT-WDR/EventBinder
  id: gimbal_mode_events
  args:
  - modules: '{{"i6x", i6x}, {"cmd", cmd}, {"gimbal", gimbal}, {"launcher", launcher}}'
  - event_binding_groups: '{{{{"i6x", I6x::SwitchHold::SW2_MID, "cmd", CMD::Mode::CMD_OP_CTRL},
      {"i6x", I6x::SwitchHold::SW2_MID, "gimbal", Gimbal::Mode::ABSOLUTE_ANGLE}, {"i6x",
      I6x::SwitchHold::SW2_DOWN, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"i6x", I6x::SwitchHold::SW2_DOWN,
      "gimbal", Gimbal::Mode::AUTO}, {"i6x", I6x::SwitchHold::SW2_UP, "gimbal", Gimbal::Mode::RELAX},
      {"i6x", I6x::SwitchPos::SW1_DOWN, "launcher", Launcher::Event::FRIC_TOGGLE}, {"i6x", I6x::Gesture::CALIBRATION_CONFIRMED, "gimbal", Gimbal::Event::CALIBRATE}, {"i6x", I6x::Gesture::CALIBRATION_SELECTING, "gimbal", Gimbal::Event::CALIBRATION_SELECTING}, {"i6x", I6x::Gesture::CALIBRATION_CANCELLED, "gimbal", Gimbal::Event::CALIBRATION_CANCELLED}}}}'
