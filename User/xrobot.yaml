modules:
  - module: WDR-Xrobot-org/BuzzerAlarm
    id: buzzer
    args:
      - pwm: pwm_tim12_ch2
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - module: WDR-Xrobot-org/BMI088
    id: imu
    args:
      - accl_cs: ACC_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi2
      - heater_pwm: pwm_tim3_ch4
      - database: database
      - ramfs: ramfs
      - buzzer: '&buzzer'
      - param:
          gyro_freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
          accl_freq: BMI088::AcclFreq::ACCL_1600HZ
          gyro_range: BMI088::GyroRange::DEG_2000DPS
          accl_range: BMI088::AcclRange::ACCL_6G
          rotation: '{1.0f, 0.0f, 0.0f, 0.0f}'
          pid_param:
            k: 1.0f
            p: 0.0f
            i: 0.0f
            d: 0.0f
            i_limit: 0.0f
            out_limit: 0.0f
            cycle: false
          gyro_topic_name: "bmi088_gyro"
          accl_topic_name: "bmi088_accl"
          target_temperature: 45
          task_stack_depth: 2048
  # 板载融合实例：AttitudeEkf 订阅 BMI088 的两个 Vector，解算并发布 board_attitude。
  - module: WDR-Xrobot-org/AttitudeEkf
    id: board_attitude
    args:
      - gyro_topic_name: "bmi088_gyro"
      - accel_topic_name: "bmi088_accl"
      - output_topic_name: "board_attitude"
      - diagnostics_topic_name: "board_fusion_diagnostics"
      - param:
          dt_source: wdr_imu::DtSource::MEASURED
          nominal_period_s: 0.001f
          task_stack_depth: 4096
      - ramfs: ramfs
      - command_name: "attitude"
  - module: xrobot-org/MadgwickAHRS
    id: madgwickahrs_0
    args:
      - ramfs: ramfs
      - param:
          beta: 0.05f
          gyro_topic_name: "bmi088_gyro"
          accl_topic_name: "bmi088_accl"
          quaternion_topic_name: "ahrs_quaternion"
          euler_topic_name: "ahrs_euler"
          task_stack_depth: 2048
settings:
  monitor_sleep_ms: 1000
