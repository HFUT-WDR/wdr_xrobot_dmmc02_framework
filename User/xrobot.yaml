modules:
  - module: WDR-Xrobot-org/BuzzerAlarm
    id: buzzer
    args:
      - pwm: pwm_tim12_ch2
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - module: WDR-Xrobot-org/BMI088
    id: imu
    args:
      - accl_cs: ACC_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi2
      - heater_pwm: pwm_tim3_ch4
      - database: database
      - ramfs: ramfs
      - buzzer: '&buzzer'
      - param:
          gyro_freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
          accl_freq: BMI088::AcclFreq::ACCL_1600HZ
          gyro_range: BMI088::GyroRange::DEG_2000DPS
          accl_range: BMI088::AcclRange::ACCL_6G
          rotation: '{1.0f, 0.0f, 0.0f, 0.0f}'
          pid_param:
            kp: 0.0f
            ki: 0.0f
            kd: 0.0f
            i_limit: 0.0f
            out_limit: 0.0f
            d_alpha: 1.0f
            deadband: 0.0f
            cycle: false
            timing:
              nominal_dt: 0.05f
              min_dt: 0.025f
              max_dt: 0.2f
          gyro_topic_name: "bmi088_gyro"
          accl_topic_name: "bmi088_accl"
          target_temperature: 45
          task_stack_depth: 2048
  # 板载融合实例：AttitudeEkf 订阅 BMI088 的两个 Vector，解算并发布 board_attitude。
  - module: WDR-Xrobot-org/AttitudeEkf
    id: board_attitude
    args:
      - ramfs: ramfs
      - param:
          dt_source: wdr_imu::DtSource::MEASURED
          nominal_period_s: 0.001f
          task_stack_depth: 4096
          gyro_topic_name: "bmi088_gyro"
          accel_topic_name: "bmi088_accl"
          output_topic_name: "board_attitude"
          diagnostics_topic_name: "board_fusion_diagnostics"
          command_name: "attitude"
  - module: xrobot-org/MadgwickAHRS
    id: madgwickahrs_0
    args:
      - ramfs: ramfs
      - param:
          beta: 0.05f
          gyro_topic_name: "bmi088_gyro"
          accl_topic_name: "bmi088_accl"
          quaternion_topic_name: "ahrs_quaternion"
          euler_topic_name: "ahrs_euler"
          task_stack_depth: 2048
  - module: WDR-Xrobot-org/ESKF
    id: eskf_0
    args:
      - ramfs: ramfs
      - param:
          dt_source: wdr_imu::DtSource::MEASURED
          nominal_period_s: 0.001f
          task_stack_depth: 4096
          accel_filter_enabled: true
          accel_filter_tau_s: 0.05f
          gyro_noise_density: 0.003f
          bias_random_walk: 0.0001f
          accel_direction_std: 0.03f
          accel_norm_soft_mps2: 0.35f
          accel_norm_reject_mps2: 1.5f
          innovation_soft: 5.991f
          innovation_reject: 25.0f
          max_direction_error_rad: 1.04719755f
          gravity_update_interval: 1
          initialization_samples: 200
          recovery_samples: 50
          rest_bias_enabled: false
          rest_gyro_threshold: 0.015f
          rest_accel_std: 0.08f
          rest_samples: 500
          rest_bias_std: 0.003f
          gyro_topic_name: "bmi088_gyro"
          accel_topic_name: "bmi088_accl"
          output_topic_name: "eskf_output"
          diagnostics_topic_name: "eskf_diagnostics"
          command_name: "eskf"
settings:
  monitor_sleep_ms: 1000
