modules:
  - module: xrobot-org/BuzzerAlarm
    id: buzzer
    args:
      - pwm: pwm_tim12_ch2
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - module: xrobot-org/BMI088
    id: imu
    args:
      - accl_cs: ACC_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi2
      - heater_pwm: pwm_tim3_ch4
      - database: imu_ram_database
      - ramfs: ramfs
      - param:
          gyro_freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
          accl_freq: BMI088::AcclFreq::ACCL_1600HZ
          gyro_range: BMI088::GyroRange::DEG_2000DPS
          accl_range: BMI088::AcclRange::ACCL_6G
          rotation: '{1.0f, 0.0f, 0.0f, 0.0f}'
          pid_param:
            k: 1.0f
            p: 0.0f
            i: 0.0f
            d: 0.0f
            i_limit: 0.0f
            out_limit: 0.0f
            cycle: false
          gyro_topic_name: "bmi088_gyro"
          accl_topic_name: "bmi088_accl"
          target_temperature: 45
          task_stack_depth: 2048
  - module: YunMo-yanyu/CMD
    id: cmd
    args:
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: "chassis_cmd"
      - gimbal_cmd_topic_name: "gimbal_cmd"
      - launcher_cmd_topic_name: "launcher_cmd"
  - module: YunMo-yanyu/I6x
    id: i6x
    args:
      - uart: uart5
      - cmd: cmd
      - topic_name: "i6x_input"
      - chassis_param:
          speed_x: 2.64
          speed_y: 2.64
          spin: 12.0
          deadband: 0.01515151515
  - module: YunMo-yanyu/BoardAttitude
    id: board_attitude
    args:
      - gyro_topic_name: "bmi088_gyro"
      - accel_topic_name: "bmi088_accl"
      - output_topic_name: "board_attitude"
      - installation: wdr_imu::IDENTITY
  - module: YunMo-yanyu/RMMotor
    id: right_front_motor
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 513
  - module: YunMo-yanyu/RMMotor
    id: left_front_motor
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 514
  - module: YunMo-yanyu/RMMotor
    id: left_rear_motor
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 515
  - module: YunMo-yanyu/RMMotor
    id: right_rear_motor
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 516
  - module: YunMo-yanyu/Chassis
    id: chassis
    args:
      - right_front: right_front_motor
      - left_front: left_front_motor
      - left_rear: left_rear_motor
      - right_rear: right_rear_motor
      - cmd: cmd
      - param:
          rpm_to_speed: 0.000299
          wheel_to_center: 0.18951
          translation_comp: 0.625
          max_speed_x: 2.0
          max_speed_y: 2.0
          max_wheel_speed: 10.0
          current_limit: 16000.0
          filter_tau: 0.1666666667
          xy_accel: 18.0
          xy_decel: 12.0
          wz_accel: 120.0
          wz_decel: 80.0
          wheel_pid:
            kp: 20000.0
            ki: 1000.0
            kd: 0.0
            alpha: 0.5
            deadband: 0.0
            i_limit: 3000.0
            out_limit: 16000.0
          follow_pid:
            kp: 12.0
            ki: 0.0
            kd: 4.0
            alpha: 0.5
            deadband: 0.0
            i_limit: 0.5
            out_limit: 12.0
          motor_timeout_ms: 10
          yaw_timeout_ms: 20
          command_timeout_ms: 100
      - command_topic_name: "chassis_cmd"
      - attitude_topic_name: "board_attitude"
      - gimbal_topic_name: "gimbal_chassis_feedback"
      - output_topic_name: "chassis_status"
      - task_stack_depth: 4096
      - thread_priority: LibXR::Thread::Priority::MEDIUM
  - module: YunMo-yanyu/EventBinder
    id: input_events
    args:
      - modules: '{{"i6x", i6x}, {"cmd", cmd}, {"chassis", chassis}}'
      - event_binding_groups: '{{{{"i6x", I6x::SwitchPos::SW2_MID, "cmd", CMD::SourceEvent::SET_GIMBAL_RC}, {"i6x", I6x::SwitchPos::SW2_UP, "cmd", CMD::SourceEvent::SET_GIMBAL_PC}, {"i6x", I6x::Chord::SW2_MID_SW3_UP_ENTER, "cmd", CMD::SourceEvent::SET_CHASSIS_RC}, {"i6x", I6x::Chord::SW2_UP_SW3_UP_ENTER, "cmd", CMD::SourceEvent::SET_CHASSIS_PC}, {"i6x", I6x::Chord::SW2_MID_SW3_UP_EXIT, "cmd", CMD::SourceEvent::SET_CHASSIS_RC}, {"i6x", I6x::Chord::SW2_UP_SW3_UP_EXIT, "cmd", CMD::SourceEvent::SET_CHASSIS_RC}, {"i6x", I6x::Chord::SW1_DOWN_SW3_UP_ENTER, "cmd", CMD::SourceEvent::SET_LAUNCHER_PC}, {"i6x", I6x::Chord::SW1_DOWN_SW3_UP_EXIT, "cmd", CMD::SourceEvent::SET_LAUNCHER_RC}, {"i6x", I6x::Chord::SW2_MID_SW3_UP_ENTER, "chassis", Chassis::Mode::NO_FOLLOW_YAW}, {"i6x", I6x::Chord::SW2_UP_SW3_UP_ENTER, "chassis", Chassis::Mode::NO_FOLLOW_YAW}, {"i6x", I6x::Chord::SW2_MID_SW3_UP_EXIT, "chassis", Chassis::Mode::RELAX}, {"i6x", I6x::Chord::SW2_UP_SW3_UP_EXIT, "chassis", Chassis::Mode::RELAX}, {"cmd", CMD::CMD_EVENT_LOST_CTRL, "chassis", Chassis::Mode::RELAX}}}}'
settings:
  monitor_sleep_ms: 1000
