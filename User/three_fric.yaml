# 独立发射产品：只有CMD、I6x、四台电机与发射任务，不启动底盘/云台/IMU业务。
modules:
  - module: WDR-Xrobot-org/CMD
    id: cmd
    args:
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: "chassis_cmd"
      - gimbal_cmd_topic_name: "gimbal_cmd"
      - launcher_cmd_topic_name: "launcher_cmd"
      - auto_chassis_wz_source: CMD::ChassisWzSource::HOST
      - auto_open_fric: true
  - module: WDR-Xrobot-org/I6x
    id: remote
    args:
      - uart: uart5
      - cmd: cmd
      - topic_name: "i6x_input"
      # CMD接口要求正量程；本产品没有底盘消费者，这些值不参与机构控制。
      - chassis_param:
          speed_x: 1.0f
          speed_y: 1.0f
          spin: 1.0f
          deadband: 0.05f
      - fric_toggle_event: static_cast<uint32_t>(I6x::SwitchPos::SW1_DOWN)
  - module: WDR-Xrobot-org/RMMotor
    id: trigger_motor
    args:
      - can_bus: can1
      - m2006_param:
          reverse: false
          feedback_id: 0x201
  - module: WDR-Xrobot-org/RMMotor
    id: fric_left_motor
    args:
      - can_bus: can1
      - m2006_param:
          reverse: false
          feedback_id: 0x202
  - module: WDR-Xrobot-org/RMMotor
    id: fric_right_motor
    args:
      - can_bus: can1
      - m2006_param:
          reverse: false
          feedback_id: 0x203
  - module: WDR-Xrobot-org/RMMotor
    id: fric_upper_motor
    args:
      - can_bus: can1
      - m2006_param:
          reverse: false
          feedback_id: 0x204
  - module: WDR-Xrobot-org/ThreeFricLauncher
    id: launcher
    args:
      - fric_left: fric_left_motor
      - fric_right: fric_right_motor
      - fric_upper: fric_upper_motor
      - trigger: trigger_motor
      - param:
          fric_radius_m: 0.020f
          firc_motor_ratio: 1.0f
          fric_target_speed: '{21.0f, 21.0f, 21.0f}'
          fric_pid:
            kp: 4000.0f
            ki: 50.0f
            kd: 0.0f
            i_limit: 500.0f
            out_limit: 10000.0f
          trigger_pid:
            kp: 2000.0f
            ki: 5.0f
            kd: 0.0f
            i_limit: 1000.0f
            out_limit: 10000.0f
          pid_timing:
            nominal_dt: 0.001f
            min_dt: 0.0005f
            max_dt: 0.004f
          trigger_motor_ratio: 36.0f
          trigger_filter_sample_hz: 1000.0f
          trigger_filter_cutoff_hz: 27.951037f
          fric_ready_speed_tolerance: 0.3f
          fric_release_speed: 0.1f
          trigger_release_rad_s: 0.1f
          trigger_target_rad_s: 20.0f
          jam_speed_rad_s: 1.0f  #堵转检测阈值
          reverse_speed_rad_s: 13.0f
          jam_ms: 1000
          reverse_ms: 500
          motor_timeout_ms: 20
          fire_topic_name: "launcher_cmd"
          status_topic_name: "launcher_status"
          command_timeout_ms: 30
          task_stack_depth: 3072
settings:
  monitor_sleep_ms: 1000
