name: BSP CI
on:
  push:
    branches: [dev, master]
    tags: ['v*']
  pull_request:
    branches: [dev, master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    uses: WDR-Xrobot-org/xrobot-ci/.github/workflows/bsp-stm32-ci.yml@dev
    with:
      project: wdr_xrobot_dmmc02_framework
      # 纯框架只构建板级默认配置；产品配置在各自 BSP 仓库构建。
      configs: |
        default
      presets: |
        Debug
        Release
    secrets:
      WDR_APP_PRIVATE_KEY: ${{ secrets.WDR_APP_PRIVATE_KEY }}
